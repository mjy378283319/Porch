# Porch · Unraid 专用 Compose
#
# 仓库与镜像均为私有，raw 链接匿名打不开，取本文件用下面任一方式：
#   1. 打开仓库页复制本文件内容，粘到 Unraid 的 Compose Manager 新建 Stack
#   2. 从本地仓库用 scp / SMB 拷到 /mnt/user/appdata/porch/docker-compose.unraid.yml
#
# 首次部署前先登录镜像仓库（Token 需 read:packages）：
#   docker login ghcr.io -u mjy378283319
#
# 然后在 /mnt/user/appdata/porch 下执行：
#   docker compose -f docker-compose.unraid.yml up -d
services:
  porch:
    image: ${PORCH_IMAGE:-ghcr.io/mjy378283319/porch:latest}
    container_name: porch
    restart: unless-stopped
    ports:
      - "${PORCH_PORT:-23000}:3000"
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - PORT=3000
      - HOST=0.0.0.0
    volumes:
      # 全部落在 appdata，Unraid 备份/迁移只认这一个目录
      - /mnt/user/appdata/porch/data:/app/server/data
      - /mnt/user/appdata/porch/music:/app/server/music
      - /mnt/user/appdata/porch/PC:/app/server/PC
      - /mnt/user/appdata/porch/APP:/app/server/APP
      - /mnt/user/appdata/porch/doc:/app/server/doc
      # Docker 管理组件：只读挂载即可查看/启停容器；不需要就删掉这两行
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/system-config >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
