<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-labelledby="porchTitle porchDesc">
  <title id="porchTitle">Porch</title>
  <desc id="porchDesc">A bright aqua window: left sidebar rail, top search bar, one white main widget card and two smaller cards.</desc>
  <defs>
    <linearGradient id="porchBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5FCBE4"/>
      <stop offset="1" stop-color="#2A94C0"/>
    </linearGradient>
    <linearGradient id="porchRail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D6F6FC"/>
      <stop offset="1" stop-color="#94D9EB"/>
    </linearGradient>
    <linearGradient id="porchCard" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.45" stop-color="#F4FDFF"/>
      <stop offset="1" stop-color="#DDF5FC"/>
    </linearGradient>
    <linearGradient id="porchChip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CBF2FA"/>
      <stop offset="1" stop-color="#87CFE6"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#porchBg)"/>
  <rect x="0.75" y="0.75" width="126.5" height="126.5" rx="27.25" fill="none" stroke="#FFFFFF" stroke-opacity="0.38" stroke-width="1.5"/>
  <rect x="17" y="18" width="22" height="92" rx="8" fill="url(#porchRail)"/>
  <rect x="21" y="21" width="3.5" height="86" rx="1.75" fill="#FFFFFF" fill-opacity="0.30"/>
  <rect x="47" y="18" width="64" height="13" rx="6.5" fill="url(#porchCard)"/>
  <rect x="47" y="44.5" width="40" height="68" rx="13" fill="#0B5C7A" fill-opacity="0.18"/>
  <rect x="47" y="43.5" width="40" height="68" rx="13" fill="#0B5C7A" fill-opacity="0.18"/>
  <rect x="47" y="42" width="40" height="68" rx="13" fill="url(#porchCard)"/>
  <rect x="51" y="43.5" width="32" height="1.5" rx="0.75" fill="#FFFFFF" fill-opacity="0.85"/>
  <rect x="94" y="41" width="17" height="32" rx="7" fill="url(#porchChip)"/>
  <rect x="94" y="79" width="17" height="31" rx="7" fill="url(#porchChip)" fill-opacity="0.86"/>
  <rect x="97" y="42.5" width="11" height="1.2" rx="0.6" fill="#FFFFFF" fill-opacity="0.55"/>
