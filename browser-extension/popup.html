<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Porch 浏览器助手</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        width: 320px;
        margin: 0;
        padding: 16px;
        background: #f7fafb;
        color: #243b47;
      }
      .header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
      .logo { width: 34px; height: 34px; border-radius: 10px; }
      h1 { font-size: 15px; margin: 0; font-weight: 700; color: #143746; }
      .status { font-size: 11px; margin-top: 2px; color: #6b8794; }
      .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; background: #d94b4b; }
      .dot.on { background: #24a86b; }
      .card {
        background: #fff;
        border: 1px solid #dfecef;
        border-radius: 12px;
        padding: 12px;
        margin-bottom: 10px;
      }
      .origin { font-size: 12px; word-break: break-all; color: #2a94c0; }
      button {
        width: 100%;
        border: 0;
        border-radius: 9px;
        padding: 10px 12px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        margin-top: 8px;
      }
      .primary { background: #2a94c0; color: #fff; }
      .primary:hover { background: #237fa7; }
      .secondary { background: #e8f4f8; color: #1d6f92; }
      .secondary:hover { background: #d7edf5; }
      button:disabled { opacity: .55; cursor: not-allowed; }
      label { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #4d6875; margin-top: 10px; }
      .tip { font-size: 11px; line-height: 1.6; color: #78909b; margin: 10px 2px 0; }
      #result { font-size: 12px; line-height: 1.5; margin-top: 10px; min-height: 18px; color: #2a7a52; }
      #result.error { color: #c13b3b; }
    </style>
  </head>
  <body>
    <div class="header">
      <img class="logo" src="icon.png" alt="Porch" />
      <div>
        <h1>Porch 浏览器助手</h1>
        <div class="status"><span id="dot" class="dot"></span><span id="status">读取状态中…</span></div>
      </div>
    </div>

    <div class="card">
      <div id="origin" class="origin">未配对</div>
      <button id="add" class="primary" type="button">收藏当前页到 Porch</button>
      <button id="open" class="secondary" type="button">打开 Porch 设置</button>
      <label>
        <input id="iframeRule" type="checkbox" />
        解除 iframe 嵌入限制
      </label>
      <div id="result"></div>
    </div>

    <p class="tip">配对：在 Porch「设置 → 开放中心」复制握手链接，然后点本图标让插件读取。之后在任意网页点图标即可收藏。</p>

    <script src="popup.js"></script>
  </body>
</html>
